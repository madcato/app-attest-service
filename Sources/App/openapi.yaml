openapi: 3.1.0
info:
  title: app-attest-service
  version: 1.0.0
servers:
  - url: http://0.0.0.0:44147
    description: Localhost service deployment.
paths:
  /secret:
    get:
      operationId: getSecret
      responses:
        '200':
          description: A success response with a the secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
    post:
      operationId: postSecret
      requestBody:
        description: The completed challenge to access the secret
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletedChallenge'
        required: true
      responses:
        '200':
          description: A success response with a the secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
components:
  schemas:
    CompletedChallenge:
      type: object
      properties:
        challenge:
          description: BASE64 encoded challenge.
          type: string
        attestation:
          description: BASE64 encoded attestation.
          type: string
        keyId:
          description: BASE64 encoded keyId.
          type: string
        deviceId:
          description: Device unique identificator
          type: string
      required:
        - challenge
        - attestation
        - keyId
        - deviceId
    Challenge:
      type: object
      properties:
        challenge:
          type: string
      required:
        - challenge
    Secret:
      type: object
      properties:
        secret:
          type: string
      required:
        - secret
  securitySchemes:
    BearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer

# 2) Apply the security globally to all operations
security:
  - BearerAuth: [] # use the same name as above
